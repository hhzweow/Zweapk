name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Unpack
        run: |
          ls -la
          unzip -o -q *.zip -d proj
          find proj -maxdepth 3 | head -50
      - name: Build
        run: |
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "Project dir: $D"
          cd "$D"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZweTOOLS-apk
          path: proj/**/app-debug.apk
